<html>
<head>
<title>2017 Automobile Data</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<style> circle {fill: lightblue; stroke: black;} </style>
<body onload='init()'>
<svg width=1200 height=800>
</svg>
<script>
async function init() {
const data = await d3.csv("https://flunky.github.io/cars2017.csv");
var cx = d3.scaleLog().base(10).domain([10,150]).range([0,1000]);
var cy = d3.scaleLog().base(10).domain([10,150]).range([600,0]);
d3.select("svg")
  .append("g")
  .attr("transform", "translate(100,100)")
  .selectAll("circle")
  .data(data)
  .enter()
  .append("circle")
    .attr("cx", function(d,i) { return cx(d.AverageCityMPG); })
    .attr("cy", function(d,i) { return cy(d.AverageHighwayMPG); })
    .attr("r", function(d,i) { return parseInt(d.EngineCylinders)*2; });
d3.select("svg").append("g")
  .attr("transform", "translate(100,100)")
  .call(
    d3.axisLeft(cy)
    .tickValues([10,20,50,100])
    .tickFormat(d3.format("~s"))
  );
d3.select('svg').append("g")
  .attr("transform", "translate(100,900)")
  .call(
    d3.axisBottom(cx)
    .tickValues([10,20,50,100])
    .tickFormat(d3.format("~s"))
  );
}
</script>
</body>
</html>
