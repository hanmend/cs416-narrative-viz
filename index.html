<!DOCTYPE html>
<html>
<head>
<title>2017 Automobile Data</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<style> circle {stroke: black;} </style>
<body onload='init()'>
<button id="myButton" style="margin: 20px;">Click Me</button>
<h2>2017 Automobile Fuel Efficiency</h2>
<svg width=800 height=800>
</svg>
<script>
async function init() {
const data = await d3.csv("https://flunky.github.io/cars2017.csv");
var color = {
    "Electricity": "green", 
    "Gasoline": "lightyellow", 
    "Diesel": "blue"
};
var cx = d3.scaleLog().base(10).domain([10,150]).range([0,600]);
var cy = d3.scaleLog().base(10).domain([10,150]).range([600,0]);
d3.select("svg")
  .append("g")
  .attr("transform", "translate(50,50)")
  .selectAll("circle")
  .data(data)
  .enter()
  .append("circle")
    .attr("cx", function(d,i) { return cx(d.AverageCityMPG); })
    .attr("cy", function(d,i) { return cy(d.AverageHighwayMPG); })
    .attr("r", function(d,i) { return 2*(parseInt(d.EngineCylinders)+2); })
    .attr("fill", function(d,i) { return color[d.Fuel]; });
d3.select("svg").append("g")
  .attr("transform", "translate(50,50)")
  .call(
    d3.axisLeft(cy)
    .tickValues([10,20,50,100])
    .tickFormat(d3.format("~s"))
  );
d3.select("svg").append("g")
  .attr("transform", "translate(50,650)")
  .call(
    d3.axisBottom(cx)
    .tickValues([10,20,50,100])
    .tickFormat(d3.format("~s"))
  );
}
</script>
</body>
</html>
